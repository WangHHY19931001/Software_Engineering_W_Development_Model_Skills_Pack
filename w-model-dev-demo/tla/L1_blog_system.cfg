(* L1_blog_system.cfg - L1 系统内外交互规格配置文件
 * 不得包含 MODULE 声明（门禁增强要求，tla-plus-guide.md §12）
 * 使用 SPECIFICATION Spec 模式（带 stuttering，避免终态误报死锁，tla-plus-guide.md §2.2）
 * INVARIANTS 列表须与 .tla 中 BusinessInvariant 展开集合完全相等（tla-plus-guide.md §11） *)

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    SystemInvariant
    UserCountInvariant
    ArticleStateInvariant
    NotificationQueueInvariant
    FileStoreInvariant
    SubscriptionInvariant
    BackupScheduleInvariant

(* 常量赋值：使用小规模有限集以保证 TLC 可控状态空间
 * 数据规模遵循 CON-003 约束（单测阶段 <=50 用户/<=100 文章）
 * 各常量使用不相交数字集合，避免集合交集干扰 *)
CONSTANTS
    Users = {1, 2}
    Articles = {3, 4}
    Categories = {5}
    Tags = {6}
    Ads = {7}
    Notifications = {8, 9}
    Files = {10}
    Subscriptions = {11}
    Backups = {12}
