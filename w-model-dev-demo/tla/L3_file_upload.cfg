(* L3_file_upload.cfg - L3 文件上传原子行为规格配置文件
 * 不得包含 MODULE 声明（门禁增强要求，tla-plus-guide.md §12）
 * 使用 SPECIFICATION Spec 模式（带 stuttering，避免终态误报死锁，tla-plus-guide.md §2.2）
 * INVARIANTS 列表须与 .tla 中 BusinessInvariant 展开集合完全相等（tla-plus-guide.md §11） *)

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    FileStateInvariant
    FileOwnerInvariant
    FileSizeInvariant
    FileTypeInvariant
    UserQuotaInvariant

(* 常量赋值：使用小规模有限集以保证 TLC 可控状态空间
 * 数据规模遵循 CON-003 约束（单测阶段 <=50 用户/<=50 文件）
 * 各常量使用不相交数字集合，避免集合交集干扰 *)
CONSTANTS
    Users = {1, 2}
    Files = {41, 42}
